apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: projects.ritesh.com
spec:
  group: ritesh.com
  names:
    plural: projects
    singular: project
    kind: Project
    shortNames:
      - proj
      - prj
      - rp
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                projectName:
                  type: string
                  description: "Name of the project"
                owner:
                  type: string
                  description: "Owner of the project"
                technology:
                  type: string
                  description: "Primary technology stack"
                environment:
                  type: string
                  description: "Deployment environment"
                status:
                  type: string
                  description: "Current status of the project"

# kubectl get projects
# kubectl get proj
# kubectl describe project ecommerce-platform