apiVersion: v1
kind: ResourceQuota
metadata:
  name: team-alpha-quota
  namespace: team-alpha-dev
spec:
  hard:
    # COMPUTE RESOURCES
    requests.cpu: "4"        # Total CPU requested by all pods
    requests.memory: 8Gi     # Total RAM requested
    limits.cpu: "10"         # Max CPU usage across all pods
    limits.memory: 16Gi      # Max RAM usage
    
    # STORAGE RESOURCES
    requests.storage: 100Gi  # Total disk space across all PVCs
    persistentvolumeclaims: "10"
    
    # OBJECT COUNTS
    pods: "20"               # Max 20 pods total
    services: "5"            # Max 5 services
    services.loadbalancers: "1" # Limit expensive cloud resources
