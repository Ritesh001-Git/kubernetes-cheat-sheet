apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-gateway-api
  namespace: production
  labels:
    app: payment-api
    tier: backend
spec:
  replicas: 3
  # Strategy: How to replace old pods with new ones
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        # Create 1 extra pod above the replica count during update
      maxUnavailable: 0  # Ensure 100% of replicas are always running during update
  
  selector:
    matchLabels:
      app: payment-api   # This MUST match the template labels below
  
  template:
    metadata:
      labels:
        app: payment-api # The "DNA" tag for the pods this deployment creates
    spec:
      containers:
      - name: api-container
        image: registry.company.com/payment-api:v2.4.1
        ports:
        - containerPort: 8080
        
        # RESOURCE MANAGEMENT (Vital for cluster stability)
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"

        # HEALTH CHECKS (The "Self-Healing" logic)
        livenessProbe:      # Is the app dead/stuck? If so, restart it.
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
        
        readinessProbe:     # Is the app ready to take traffic? (e.g., DB connected?)
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10

        # ENVIRONMENT CONFIG
        env:
          - name: DB_URL
            valueFrom:
              secretKeyRef:
                name: db-secrets
                key: url
