apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluentd-cloud-logging
  namespace: kube-system # Usually sits in system namespaces
  labels:
    k8s-app: fluentd-logging
spec:
  selector:
    matchLabels:
      name: fluentd-bin
  template:
    metadata:
      labels:
        name: fluentd-bin
    spec:
      # Use Tolerations to ensure it runs on Master/Control-Plane nodes too
      tolerations:
      - key: node-role.kubernetes.io/master
        effect: NoSchedule
      
      containers:
      - name: fluentd
        image: fluentd:v1.14
        resources:
          limits:
            memory: 200Mi
          requests:
            cpu: 100m
            memory: 100Mi
        volumeMounts:
        - name: varlog
          mountPath: /var/log # Accessing host logs
        - name: varlibdockercontainers
          mountPath: /var/lib/docker/containers
          readOnly: true
          
      # Host-level volumes (Company Standard for DaemonSets)
      volumes:
      - name: varlog
        hostPath:
          path: /var/log
      - name: varlibdockercontainers
        hostPath:
          path: /var/lib/docker/containers
