apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo-db
  namespace: data-tier
spec:
  serviceName: "mongo-internal" # Links to a Headless Service
  replicas: 3
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
      - name: mongo
        image: mongo:6.0
        ports:
        - containerPort: 27017
          name: peer
        volumeMounts:
        - name: mongo-data
          mountPath: /data/db
        resources:
          requests:
            cpu: "500m"
            memory: "2Gi"
          limits:
            cpu: "1"
            memory: "4Gi"

  # The "Magic" section: Each pod gets its own 10Gi SSD
  volumeClaimTemplates:
  - metadata:
      name: mongo-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "premium-ssd" # Cloud provider specific
      resources:
        requests:
          storage: 10Gi
